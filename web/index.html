<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EDP APP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>EDP APP</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body, html {
      /* Prevent trackpad swipe to go back/forward */
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window._currentCameraStream = null;

    window.startWebcam = function(callback) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (callback) callback({ success: false, error: 'Webcam not supported in this browser' });
        return;
      }
      if (window._currentCameraStream) {
        if (callback) callback({ success: true });
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          window._currentCameraStream = stream;
          if (callback) callback({ success: true });
        })
        .catch(function(err) {
          console.warn('getUserMedia error:', err);
          if (callback) callback({ success: false, error: (err.name || 'Error') + ': ' + (err.message || err.toString()) });
        });
    };

    window.stopWebcam = function() {
      if (window._currentCameraStream) {
        window._currentCameraStream.getTracks().forEach(function(t) { t.stop(); });
        window._currentCameraStream = null;
      }
    };

    window.attachWebcamToVideo = function(videoEl) {
      if (window._currentCameraStream && videoEl) {
        videoEl.srcObject = window._currentCameraStream;
        videoEl.muted = true;
        videoEl.playsInline = true;
        videoEl.setAttribute('playsinline', 'true');
        videoEl.setAttribute('webkit-playsinline', 'true');
        const playPromise = videoEl.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(e) {
            console.warn('video play warning:', e);
          });
        }
      }
    };

    window.captureWebcamFrame = function(videoEl) {
      if (!videoEl || !window._currentCameraStream) return null;
      try {
        const w = videoEl.videoWidth || 640;
        const h = videoEl.videoHeight || 480;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(videoEl, 0, 0, w, h);
        return canvas.toDataUrl('image/jpeg', 0.85);
      } catch (e) {
        console.error('Frame capture error:', e);
        return null;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
